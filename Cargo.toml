[workspace]
resolver = "2"
members = [
  "crates/hd2-core",
  "crates/hd2-source-udp",
  "crates/hd2-source-http",
  "crates/hd2-dglab",
  "crates/hd2-controller",
  "crates/hd2-app",
]

[workspace.package]
version = "0.6.4"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
